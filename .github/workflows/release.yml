name: Release

# Rilis otomatis: push tag "v*" → build .app → pack .dmg + .app.zip → upload ke GitHub Releases.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PROJECT: Mouse Jiggler.xcodeproj
  SCHEME: MouseJiggler
  APP_NAME: Mouse Jiggler

jobs:
  release:
    name: Build & publish
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Project dibuat dengan Xcode 26.3, jadi pakai Xcode stabil terbaru di runner.
      - name: Pilih Xcode stabil terbaru
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build .app (Release)
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Baca versi dari Info.plist
        id: meta
        run: |
          APP="build/Build/Products/Release/$APP_NAME.app"
          test -d "$APP" || { echo "App bundle tidak ditemukan: $APP"; exit 1; }
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App: $VERSION | Tag: $GITHUB_REF_NAME"

      - name: Ad-hoc sign (tanpa akun Apple Developer)
        run: |
          codesign --force --deep --sign - "${{ steps.meta.outputs.path }}"
          codesign --verify --deep --strict --verbose=2 "${{ steps.meta.outputs.path }}"

      - name: Pack .app.zip
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "${{ steps.meta.outputs.path }}" "dist/MouseJiggler-$GITHUB_REF_NAME.app.zip"

      - name: Pack .dmg
        run: |
          rm -rf dmg-root
          mkdir -p dmg-root dist
          ditto "${{ steps.meta.outputs.path }}" "dmg-root/$APP_NAME.app"
          ln -s /Applications "dmg-root/Applications"
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "dist/MouseJiggler-$GITHUB_REF_NAME.dmg"
          rm -rf dmg-root

      - name: Upload ke GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$APP_NAME $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
